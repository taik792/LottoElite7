<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotto Intelligence V11</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#263238;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.header{background:#0737b8;color:#fff;border-radius:14px;padding:18px;text-align:center;box-shadow:0 3px 12px #0002}
.header h1{margin:0;font-size:28px}.header .date{margin-top:6px;font-size:14px;opacity:.9}
.section-title{margin:24px 2px 10px;font-size:21px;font-weight:800;border-bottom:3px solid #cbd3df;padding-bottom:7px}
.card{background:#fff;border-radius:14px;margin:10px 0;padding:16px;box-shadow:0 2px 10px #0001;border-left:5px solid #1769e0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f7f9fc;border-radius:10px;padding:11px;text-align:center}
.stat .lab{font-size:12px;color:#687584;font-weight:700;text-transform:uppercase}.stat .val{font-size:21px;font-weight:800;margin-top:5px}
.pred-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.wheel{font-size:21px;font-weight:900;color:#183f86}
.calc{background:#eef3fb;padding:10px;border-radius:9px;font-size:13px;text-align:right}
.nums{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.num{width:42px;height:42px;border-radius:50%;background:#f0f3f7;display:flex;align-items:center;justify-content:center;font-weight:800}
.pred-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:10px;padding:12px;text-align:center}.ambata{background:#fff0d8}.ambo{background:#dcecff}
.box small{display:block;font-weight:800;color:#596775}.box strong{display:block;font-size:24px;margin-top:4px}
.ambetti{text-align:center;background:#f8fafc;border-radius:9px;padding:9px;margin-top:9px;font-weight:600}
.history{border-left:5px solid #8795a8}.history.win{border-left-color:#31c982}.history.live{border-left-color:#50647e}
.hist-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}
.badge{padding:7px 10px;border-radius:8px;font-size:12px;background:#edf0f5}.badge.win{background:#c9f5df;color:#08643d}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hist-box{background:#f7f9fc;border-radius:9px;padding:10px;text-align:center}.hist-box small{display:block;color:#65717e;font-weight:700}.hist-box strong{font-size:20px}
.result{text-align:center;font-weight:800;margin-top:9px}.green{color:#08704b}
.top table{width:100%;border-collapse:collapse;font-size:13px}.top th,.top td{padding:8px;border-bottom:1px solid #e1e5eb;text-align:center}.top th{background:#f2f5f9}
.error{background:#ffe6e6;color:#9b1c1c;padding:14px;border-radius:10px;font-weight:700}
@media(max-width:700px){.wrap{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}.pred-head{display:block}.calc{text-align:left;margin-top:8px}.pred-grid,.hist-grid{grid-template-columns:1fr}.header h1{font-size:23px}.wheel{margin-bottom:5px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Caricamento V11...</div></div>

<script>
const FILE="risultati_v4.json";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function fmt(v,dec=2){
  if(v===null || v===undefined || v==="") return "N.D.";
  const n=Number(v);
  return Number.isFinite(n) ? n.toFixed(dec).replace(".",",") : esc(v);
}
function pct(v){
  if(v===null || v===undefined || v==="") return "N.D.%";
  return fmt(v,2)+"%";
}
function statoClass(s){
  if(String(s).toUpperCase().includes("AMBO SECCO")) return "win";
  if(String(s).toUpperCase().includes("IN GIOCO")) return "live";
  return "";
}
function badge(s){
  const up=String(s||"").toUpperCase();
  if(up.includes("AMBO SECCO")) return '<span class="badge win">AMBO SECCO</span>';
  if(up.includes("AMBATA")) return '<span class="badge win">AMBATA</span>';
  if(up.includes("IN GIOCO")) return '<span class="badge">IN GIOCO</span>';
  return '<span class="badge">CICLO CONCLUSO</span>';
}
function stat(label,val){
  return `<div class="stat"><div class="lab">${esc(label)}</div><div class="val">${esc(val)}</div></div>`;
}
function prediction(ruota,p){
  if(!p) return "";
  const nums=(p.numeri_estrazione||[]).map(n=>`<span class="num">${esc(n)}</span>`).join("");
  const ambo=Array.isArray(p.ambo)?p.ambo.join(" - "):p.ambo;
  const ambetti=(p.ambetti||[]).map(a=>Array.isArray(a)?a.join(" - "):a).join(" | ");
  return `<div class="card">
    <div class="pred-head"><div class="wheel">${esc(ruota)}</div><div class="calc">${esc(p.tipo_calcolo||"")}</div></div>
    <div class="nums">${nums}</div>
    <div class="pred-grid">
      <div class="box ambata"><small>AMBATA</small><strong>${esc(p.ambata)}</strong></div>
      <div class="box ambo"><small>AMBO SECCO</small><strong>${esc(ambo)}</strong></div>
    </div>
    <div class="ambetti">Ambetti: ${esc(ambetti)}</div>
  </div>`;
}
function historyCard(x){
  const s=x.stato||"";
  const win=String(s).toUpperCase().includes("AMBO SECCO");
  return `<div class="card history ${statoClass(s)}">
    <div class="hist-head"><span>${esc(x.data||"Concorso")}</span>${badge(s)}</div>
    <div class="hist-grid">
      <div class="hist-box"><small>AMBATA</small><strong>${esc(x.ambata)}</strong></div>
      <div class="hist-box"><small>AMBO</small><strong>${esc(x.ambo)}</strong></div>
    </div>
    <div class="result ${win?"green":""}">Esito: ${esc(s)}${x.colpo ? " · "+esc(x.colpo)+"° colpo" : ""}</div>
  </div>`;
}
async function load(){
  try{
    const r=await fetch(FILE+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json(), m=d.motore||{}, p=d.previsioni||{};
    const origine=m.ruota_origine||"";
    const target=m.ruota_target||"";
    const ambo=p[origine]?.ambo||[];
    const storico=m;
    let html=`<div class="header"><h1>Lotto Intelligence V11</h1><div class="date">Estrazione del ${esc(d.info_concorso?.data||"")}</div></div>`;

    html+=`<div class="card">
      <div style="font-size:17px;font-weight:900;margin-bottom:12px">V11 - Isotopia ambo secco <span style="color:#607080;font-weight:700">· ${esc(origine)} → ${esc(target)}</span></div>
      <div class="grid">
        ${stat("Shift","+"+(m.shift??"N.D."))}
        ${stat("Score",fmt(m.score_backtest,4))}
        ${stat("Cicli",m.cicli_testati??"N.D.")}
        ${stat("Ambi 1° colpo",m.ambi_1_colpo??"N.D.")}
        ${stat("% ambo 1°",pct(m.percentuale_1_colpo))}
        ${stat("% ambo ≤3",pct(m.percentuale_entro_3))}
        ${stat("Ambi ≤3",m.ambi_entro_3??"N.D.")}
        ${stat("Ambi ≤5",m.ambi_entro_5??"N.D.")}
        ${stat("Ambi ≤9",m.ambi_entro_9??"N.D.")}
      </div>
    </div>`;

    html+=`<div class="section-title">PREVISIONE IN CORSO</div>`;
    html+=prediction(origine,p[origine]);
    html+=prediction(target,p[target]);

    html+=`<div class="section-title">ARCHIVIO STORICO BLINDATO</div>`;
    const hist=d.storico_verificato||[];
    if(hist.length) html+=hist.map(historyCard).join("");
    else html+=`<div class="card">Nessun dato storico disponibile.</div>`;

    const top=m.top10_configurazioni||[];
    if(top.length){
      html+=`<div class="section-title">TOP 10 CONFIGURAZIONI V11</div><div class="card top"><table>
      <thead><tr><th>#</th><th>Ruote</th><th>Shift</th><th>Score</th><th>1° colpo</th><th>≤3</th><th>≤9</th></tr></thead><tbody>`;
      html+=top.map(x=>`<tr><td>${esc(x.posizione)}</td><td>${esc(x.origine)} → ${esc(x.target)}</td><td>+${esc(x.shift)}</td><td>${fmt(x.score,4)}</td><td>${pct(x.percentuale_1_colpo)}</td><td>${pct(x.percentuale_entro_3)}</td><td>${pct(x.percentuale_entro_9)}</td></tr>`).join("");
      html+=`</tbody></table></div>`;
    }

    html+=`<div class="card" style="font-size:12px;color:#697582;text-align:center">Motore: ${esc(m.versione||"V11")} · Trasformazione: ${esc(m.trasformazione||"DIAMETRALE")} · File dati: risultati_v4.json</div>`;
    document.getElementById("app").innerHTML=html;
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="error">Errore caricamento V11: ${esc(e.message)}<br><br>Controlla che <b>risultati_v4.json</b> sia presente nella root del progetto.</div>`;
  }
}
load();
</script>
</body>
</html>
