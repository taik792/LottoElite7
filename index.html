<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Intelligence V10</title>
    <style>
        :root {
            --primary:#1e3a8a;
            --accent:#3b82f6;
            --bg:#f8fafc;
            --card:#fff;
            --text:#1e293b;
            --muted:#64748b;
            --ambata-bg:#ffedd5;
            --ambata-txt:#ea580c;
            --ambo-bg:#dbeafe;
            --ambo-txt:#1d4ed8;
            --win-bg:#d1fae5;
            --win-txt:#065f46;
            --border:#cbd5e1;
        }
        * { box-sizing:border-box; }
        body {
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:var(--bg);
            color:var(--text);
            margin:0;
            padding:12px;
        }
        .container { max-width:600px; margin:0 auto; }
        header {
            text-align:center;
            margin-bottom:16px;
            background:linear-gradient(135deg,#1e3a8a,#1d4ed8);
            padding:16px;
            border-radius:12px;
            color:#fff;
        }
        header h1 { margin:0 0 4px; font-size:1.3rem; }
        .info-concorso { font-size:.85rem; color:#bfdbfe; margin:0; }
        .section-title {
            font-size:1.05rem;
            font-weight:700;
            margin:20px 0 10px;
            color:#0f172a;
            text-transform:uppercase;
            border-bottom:2px solid var(--border);
            padding-bottom:4px;
        }
        .motore-box {
            background:#fff;
            border-radius:12px;
            padding:12px;
            margin-bottom:12px;
            box-shadow:0 4px 6px -1px rgba(0,0,0,.05);
            border-left:5px solid var(--accent);
        }
        .motore-title {
            font-weight:800;
            color:var(--primary);
            margin-bottom:8px;
        }
        .stats {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:6px;
        }
        .stat {
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:8px;
            padding:7px 4px;
            text-align:center;
        }
        .stat-label { font-size:.64rem; color:var(--muted); text-transform:uppercase; font-weight:700; }
        .stat-value { font-size:.95rem; font-weight:800; margin-top:2px; }
        .card-ruota {
            background:var(--card);
            border-radius:12px;
            padding:14px;
            box-shadow:0 4px 6px -1px rgba(0,0,0,.05);
            border-left:5px solid var(--accent);
            margin-bottom:12px;
        }
        .card-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
            margin-bottom:8px;
        }
        .ruota-title {
            font-size:1.05rem;
            font-weight:700;
            text-transform:uppercase;
            color:var(--primary);
        }
        .spia-badge {
            background:#f1f5f9;
            color:#475569;
            font-size:.68rem;
            padding:4px 6px;
            border-radius:4px;
            font-weight:700;
            text-align:right;
        }
        .palline-box {
            display:flex;
            gap:6px;
            margin-bottom:12px;
            flex-wrap:wrap;
        }
        .pallina {
            width:30px;
            height:30px;
            background:#f1f5f9;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:600;
            font-size:.85rem;
        }
        .previsione-box {
            display:flex;
            gap:8px;
            margin-bottom:8px;
        }
        .prev-item {
            flex:1;
            padding:8px;
            border-radius:8px;
            text-align:center;
        }
        .prev-item.ambata { background:var(--ambata-bg); color:var(--ambata-txt); }
        .prev-item.ambo { background:var(--ambo-bg); color:var(--ambo-txt); }
        .prev-label { font-size:.7rem; text-transform:uppercase; font-weight:700; margin-bottom:2px; }
        .prev-value { font-size:1.1rem; font-weight:800; }
        .ambetti-box {
            background:#fafafa;
            border:1px solid #e5e7eb;
            padding:6px;
            border-radius:8px;
            font-size:.75rem;
            text-align:center;
        }
        .ambetti-valori { color:#4b5563; font-weight:600; }
        .storico-info {
            font-size:.72rem;
            color:var(--muted);
            margin-top:6px;
        }
        .error {
            background:#fee2e2;
            color:#991b1b;
            padding:12px;
            border-radius:10px;
            font-size:.85rem;
        }
        @media (max-width:420px) {
            .stats { grid-template-columns:repeat(2,1fr); }
            .card-header { align-items:flex-start; }
            .spia-badge { max-width:58%; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="titolo">Lotto Intelligence V10</h1>
        <p id="info-data" class="info-concorso">Caricamento...</p>
    </header>

    <div id="motore-container"></div>

    <div class="section-title">Previsione in Corso</div>
    <div id="ruote-list"></div>

    <div class="section-title" style="margin-top:30px;">Archivio Storico Blindato</div>
    <div id="storico-list"></div>
</div>

<script>
async function caricaRisultati() {
    try {
        const response = await fetch('risultati_v4.json?t=' + Date.now(), { cache:'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        const motore = data.motore || {};
        const versione = motore.versione || data.info_concorso?.numero || 'Lotto Intelligence V10';
        document.getElementById('titolo').innerText = 'Lotto Intelligence V10';
        document.getElementById('info-data').innerText =
            `Estrazione del: ${data.info_concorso?.data || 'N.D.'}`;

        const motoreContainer = document.getElementById('motore-container');
        if (motore.ruota_origine && motore.ruota_target) {
            motoreContainer.innerHTML = `
                <div class="motore-box">
                    <div class="motore-title">
                        ${versione}
                        <span style="font-size:.72rem;color:#64748b;font-weight:600;">
                            · ${motore.ruota_origine} → ${motore.ruota_target}
                        </span>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">Shift</div>
                            <div class="stat-value">+${motore.shift ?? 'N.D.'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Score</div>
                            <div class="stat-value">${motore.score_backtest ?? 'N.D.'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Cicli</div>
                            <div class="stat-value">${motore.cicli_testati ?? 'N.D.'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Ambi</div>
                            <div class="stat-value">${motore.ambi_backtest ?? 'N.D.'}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">% Ambo</div>
                            <div class="stat-value">${motore.percentuale_ambo ?? 'N.D.'}%</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">% Ambata</div>
                            <div class="stat-value">${motore.percentuale_ambata ?? 'N.D.'}%</div>
                        </div>
                    </div>
                </div>`;
        } else {
            motoreContainer.innerHTML = '';
        }

        const container = document.getElementById('ruote-list');
        container.innerHTML = '';

        const previsioni = data.previsioni || {};
        const ruote = Object.entries(previsioni);

        if (!ruote.length) {
            container.innerHTML = '<div class="error">Nessuna previsione presente nel file risultati_v4.json.</div>';
        }

        for (const [ruota, info] of ruote) {
            const card = document.createElement('div');
            card.className = 'card-ruota';

            const numeri = Array.isArray(info.numeri_estrazione) ? info.numeri_estrazione : [];
            const pallineHTML = numeri.map(num => `<div class="pallina">${num}</div>`).join('');
            const amboStr = Array.isArray(info.ambo) ? info.ambo.join(' - ') : (info.ambo ?? 'N.D.');
            const ambetti = Array.isArray(info.ambetti) ? info.ambetti : [];
            const ambettiString = ambetti.map(a => Array.isArray(a) ? a.join(' - ') : a).join(' | ');

            card.innerHTML = `
                <div class="card-header">
                    <span class="ruota-title">${ruota}</span>
                    <span class="spia-badge">${info.tipo_calcolo || 'Isotopia V9'}</span>
                </div>
                <div class="palline-box">${pallineHTML}</div>
                <div class="previsione-box">
                    <div class="prev-item ambata">
                        <div class="prev-label">Ambata</div>
                        <div class="prev-value">${info.ambata ?? 'N.D.'}</div>
                    </div>
                    <div class="prev-item ambo">
                        <div class="prev-label">Ambo Secco</div>
                        <div class="prev-value">${amboStr}</div>
                    </div>
                </div>
                <div class="ambetti-box">
                    <div class="ambetti-valori">Ambetti: ${ambettiString || 'N.D.'}</div>
                </div>
            `;
            container.appendChild(card);
        }

        const storicoContainer = document.getElementById('storico-list');
        storicoContainer.innerHTML = '';

        const storico = Array.isArray(data.storico_verificato) ? data.storico_verificato : [];
        if (!storico.length) {
            storicoContainer.innerHTML =
                '<p style="font-size:.85rem;color:#64748b;text-align:center;">Nessuna previsione passata registrata.</p>';
            return;
        }

        const origine = motore.ruota_origine || ruote[0]?.[0] || '';
        const target = motore.ruota_target || ruote[1]?.[0] || '';
        const coppia = `${origine} - ${target}`;

        [...storico].reverse().forEach(item => {
            const minicard = document.createElement('div');
            minicard.className = 'card-ruota';

            const isWin = item.stato && item.stato !== 'In gioco';
            minicard.style.borderLeft = isWin
                ? '5px solid var(--win-bg)'
                : '5px solid #64748b';

            const badgeBg = isWin ? 'var(--win-bg)' : '#f1f5f9';
            const badgeTxt = isWin ? 'var(--win-txt)' : '#475569';

            minicard.innerHTML = `
                <div class="card-header">
                    <span class="ruota-title" style="color:#475569;">
                        ${coppia} (${item.data || 'N.D.'})
                    </span>
                    <span class="spia-badge"
                          style="background:${badgeBg};color:${badgeTxt};font-weight:bold;">
                        ${item.colpi || ''}
                    </span>
                </div>
                <div class="previsione-box">
                    <div class="prev-item ambata"
                         style="background:#f8fafc;color:#475569;">
                        <div class="prev-label">Ambata</div>
                        <div class="prev-value">${item.ambata ?? 'N.D.'}</div>
                    </div>
                    <div class="prev-item ambo"
                         style="background:#f1f5f9;color:#1e293b;">
                        <div class="prev-label">Ambo</div>
                        <div class="prev-value">${item.ambo ?? 'N.D.'}</div>
                    </div>
                </div>
                <div style="text-align:center;font-size:.75rem;font-weight:bold;
                            color:${isWin ? 'var(--win-txt)' : '#64748b'};margin-top:4px;">
                    Esito: ${item.stato || 'N.D.'}
                </div>
            `;
            storicoContainer.appendChild(minicard);
        });

    } catch (e) {
        console.error(e);
        document.getElementById('ruote-list').innerHTML =
            '<div class="error">Errore nel caricamento di risultati_v4.json. Controlla che il file sia presente nella root del progetto.</div>';
    }
}

window.onload = caricaRisultati;
</script>
</body>
</html>
